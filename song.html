<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>我们俩</title>
  <style>
    :root {
      --shadow: rgba(0,0,0,0.28);
      --overlay: rgba(0,0,0,0.35);
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0; padding: 20px; min-height: 100vh;
      display: flex; align-items: center; justify-content: center; text-align: center;
      color: #fff;
      font-family: -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;

      /* 两层背景：遮罩 + 图片 */
      background-image:
        linear-gradient(135deg, var(--overlay), var(--overlay)),
        url("https://raw.githubusercontent.com/hamber2005/womenlia/main/womenlia.png?v=1");
      /* 渐变层不缩放；图片层用 contain 确保整图可见 */
      background-size: auto, contain;
      background-position: center;
      background-repeat: no-repeat;
      background-color: #000; /* 留白区域用纯色填充 */
    }

    audio { width: min(92vw, 560px); margin: 18px 0 8px; border-radius: 8px; outline: none; }
    .download { display:inline-block; margin-top:8px; font-size:14px; opacity:.9; color:#fff; }
    .download:hover { text-decoration: underline; }
  </style>
</head>
<body>

  <audio controls preload="none">
    <source src="https://raw.githubusercontent.com/hamber2005/womenlia/main/我们俩.mp3" type="audio/mpeg">
    你的浏览器不支持音频播放。
  </audio>

  <div>
    <a class="download" href="https://raw.githubusercontent.com/hamber2005/womenlia/main/我们俩.mp3" download>下载歌曲</a>
  </div>

</body>
</html>
